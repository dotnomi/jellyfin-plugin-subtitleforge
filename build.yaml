changelog: >
  0.5.2: Saved style applies to the next playback without reloading the web client. Choose which subtitle to translate.
  Fixes from a full review: a slow or failing source no longer aborts the nightly run or blocks the title for a week
  (retried next run); Whisper/OCR errors fail only that title; unreadable image tracks are not OCR'd every night;
  manual jobs no longer wait behind automatic ones outside the time window; the sync task never writes back a file
  that changed meanwhile; "doesn't fit" on forced subtitles and on read-only folders; Romanian, Greek, Slovak and
  other languages with two ISO codes are recognised; Cyrillic/Central European/Japanese legacy encodings; ntfy titles
  with umlauts; shifted copies of other files keep their forced flag and do not overwrite each other; junk timestamps
  can no longer make the audio check use gigabytes of memory; test notification no longer takes real entries.
  0.5.1: Subtitle background is one box around all lines (no darker overlap between lines), style number fields are
  limited to their range (an outline of 340 px no longer breaks the preview), font weight offers only normal and bold (the two weights subtitle fonts actually have).
  0.5: Subtitle tools in the player (other match, sync check, shift timing earlier/later) and in every file list,
  recycle bin for deleted and rejected subtitles, filter for titles missing one language, sources ranked by what
  fitted before, optional weekly report, settings export/import (without secrets), subtitle polish (repairs broken
  umlauts/encoding, optional line wrapping and minimum display time), dictionary-based OCR correction.
  0.4: English interface (German stays available), SubtitleForge entry in Jellyfin's "⋮" menu and for multi-select,
  delete single subtitles the plugin made, every plugin subtitle is marked "[SF]" (older files are renamed once),
  live style preview, batch actions in the overview, OCR for DVD (VobSub) subtitles, Docker example with Vulkan.
  Security hardening: signed download ids, https-only host allowlists and size limits for downloads, zip bomb and
  image-subtitle memory limits, safe file names from container language tags, atomic temp files, hardened parsers.
