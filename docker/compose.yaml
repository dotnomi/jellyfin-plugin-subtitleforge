# Jellyfin with GPU access for SubtitleForge (Whisper via Vulkan) and hardware transcoding.
# Start: docker compose up -d --build
services:
  jellyfin:
    build:
      context: .
      args:
        JELLYFIN_VERSION: "12.4"
    image: jellyfin-vulkan:12.4
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host            # or: ports: ["8096:8096"]
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /path/to/media:/media     # subtitles are written next to the media: mount it writable
    # AMD / Intel: pass the render nodes through.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-105}"      # the host's render group: getent group render | cut -d: -f3

    # NVIDIA (proprietary driver + NVIDIA Container Toolkit on the host): remove "devices" above and use this.
    # "graphics" is required, otherwise the container gets no Vulkan driver.
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility,graphics
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
